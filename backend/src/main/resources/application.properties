spring.application.name=backend

# Mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Kakao
kakao.client-id=${KAKAO_REST_API_KEY}
kakao.redirect-uri=http://localhost:8080

# JWT
jwt.secret=${JWT_SECRET_KEY}

#mybatis
mybatis.type-handlers-package=com.example.backend.global.mybatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/*.xml

